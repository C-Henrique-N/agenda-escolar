app = 'agenda-escolar-hbkxjq'
primary_region = 'iad'
console_command = '/app/manage.py shell'

[build]

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'

[[mounts]]
  source = "agenda_data"
  destination = "/data"